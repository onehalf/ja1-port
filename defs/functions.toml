# Function signatures: name (labels.csv, or "0x…" for an unnamed function) = [signature, evidence, note]
#   signature: "ret (type name, ...)" with the types of defs/types.toml plus T* (32-bit pointer to T; void* allowed)
#     and "?" = unknown 4 bytes (as a return: keep what Ghidra infers). Parameters in Watcom register order EAX EDX
#     EBX ECX, then stack (the __cdecl functions of defs/cdecl.txt: stack only); a u8 parameter is AL/DL/BL/CL.
#   evidence: V = verified (diff test / live), T = traced in the asm, G = scanner candidate not reviewed one by one
# Applied by tools/ghidra/ApplyJA.java (./t ghidra); checked by ./t jatypes.
