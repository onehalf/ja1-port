# JA.EXE data types: the single source of truth for struct layouts and typed globals.
# Read by tools/jatypes.py (decoding dumps, saves and live memory via tools/jactl.py), turned into a C header for
# Ghidra (./t jatypes --header), later the port. Addresses of globals come from labels.csv (by name), not from here.
#
# field = [offset, type, name, evidence, note]
#   type: u8 i8 u16 i16 u32 i32 ptr | char[N] | <struct> | any of these with [N] for arrays
#   evidence: V = verified (live dump, save compare or diff test), T = traced in code only, G = guess
# A field whose size is unknown is typed u8 and says so in its note.

[struct.item]
size = 0x0C
doc = "item entry: soldier inventory, XRA enemy templates, g_groundItems"
fields = [
  [0x00, "u8", "type", "V", "index into g_itemTable / g_itemNames (0 = Nothing)"],
  [0x01, "u8", "qty", "V", "quantity / rounds loaded"],
  [0x02, "u8", "condition", "V", "0..100"],
  [0x06, "u8", "b6", "G", "FF while in combat (ground items)"],
  [0x08, "u8[4]", "unitCond", "G", "per-unit conditions?"],
]

[struct.soldier]
size = 0x200
doc = "g_soldiers slot: 0..7 player mercs, 8..15 guards, 0x28..0x2F sector enemies (from XRA.DAT)"
fields = [
  [0x000, "item[12]", "items", "V", "0 main hand, 1 secondary hand, 2 head, 4 ear, 6 vest, 7.. vest pockets"],
  [0x090, "ptr", "ptr90", "T", "pointer; QuickSave stores it as offset (-0x106C18) in +0x98"],
  [0x098, "u32", "ptr90Saved", "T", "serialised +0x90"],
  [0x09C, "u8", "visible", "T", "debug page 'visible' (cursor.md:551; was b09C). EngagedAction/AiThink: > 0 lets Santino speak; CombatAction forces 0xFF around ReachTile?"],
  [0x0A8, "u8", "a8", "G", "differs before/after QuickSave"],
  [0x0B0, "u8", "b0", "G", "differs before/after QuickSave; changes outside AiThink for every soldier (live_ai: interrupt-driven?)"],
  [0x0B9, "u8", "hasKeys", "V", "debug page 'has Keys' (cursor.md:551; was b0B9). FindPath: may enter move code 1500 (closed door) from a 0x62D4 tile; a walk into a not-standable tile with it set calls host op 107 = 0x3ACB8 (soldier_update.md:347, tools/ai.py says \"breaks\"); both fit doors, the key meaning is not traced"],
  [0x0BA, "u8", "aiType", "V", "AI kind: 2 never acts, 4 Santino; 1 and 3 extra rules (only 3 reacts when alerted)"],
  [0x0BB, "u8", "alert", "V", "AI alert state: 0 calm, 1 alerted (noise), 2 combat, 3 engaged (+0x1D5 > 0)"],
  [0x0CC, "u8", "cc", "G", "differs before/after QuickSave; changes outside AiThink for every soldier (live_ai: interrupt-driven?)"],
  [0x0D0, "u16", "lastTargetTile", "T", "same target as last shot: +10 to hit, no +1 AP (ChanceToHit, ShotApCost)"],
