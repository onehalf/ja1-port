  [0x28, "u16", "salary", "V", "per day; doubled by the negotiation branch"],
  [0x2A, "u8", "health", "V", ""],
  [0x2B, "u8", "energy", "V", "100 in all records; copied to soldier +0x18A"],
  [0x2C, "u8", "agility", "V", ""],
  [0x2D, "u8", "marksmanship", "V", ""],
  [0x2E, "u8", "wisdom", "V", ""],
  [0x35, "u8", "availDay", "T", "MercRefusalReason 1; > 100: refuses while g_aimSuccessPoints < this - 100"],
