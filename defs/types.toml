  [0x3D, "u8", "firedByYou", "V", "1 after you fire it (refusal 9)"],
  [0x3E, "u16", "b3E", "T", "refusal 12 if != 0"],
  [0x40, "u8", "medical", "V", ""],
  [0x41, "u8", "mechanical", "V", ""],
  [0x42, "u8", "dexterity", "V", ""],
  [0x43, "u8", "explosives", "V", ""],
