name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # SDL2 is built from source (sdl2/bundled), as in the release builds: Ubuntu's libsdl2 has no dummy video
      # driver, which the window tests use.
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxinerama-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
      - name: ja1logic tests
        run: cargo test --release --locked
        working-directory: port/ja1logic
      - name: ja1front tests (game-file tests skip without rom/)
        run: cargo test --release --locked --features sdl2/bundled,sdl2/static-link
        working-directory: port/ja1front

  windows-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip
      - run: scripts/build-release.sh windows
