# Original JA.EXE under DOSBox: writable scratch copy in validate/run/C, CD image (read-only) as D:.
# GOG settings: svga_s3, 16 MB, cycles=max. Sound off for headless runs (run.sh --sound turns it on).
[sdl]
fullscreen=false
output=surface
windowresolution=original
# autolock=false: absolute host mouse moves reach the game 1:1 (with autolock on, 0.74 ignores xdotool motion)
autolock=false
[dosbox]
machine=svga_s3
memsize=16
captures=shots
[cpu]
core=auto
cputype=auto
cycles=max
[mixer]
nosound=true
[speaker]
pcspeaker=false
[autoexec]
MOUNT C run/C
IMGMOUNT D ../rom/JA1.gog -t iso -fs iso
C:
JA.EXE
EXIT
