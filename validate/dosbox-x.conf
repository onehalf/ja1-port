# DOSBox-X variant of dosbox.conf, for its built-in debugger (memory dumps, breakpoints): run_x.sh starts it inside
# tmux so the debugger console can be driven with send-keys / capture-pane. core=normal so breakpoints are honored.
[sdl]
fullscreen=false
output=surface
autolock=false
[dosbox]
saveremark=false
machine=svga_s3
memsize=16
captures=../shots
fastbioslogo=true
startbanner=false
[cpu]
core=normal
cputype=auto
cycles=max
[mixer]
nosound=true
[speaker]
pcspeaker=false
[autoexec]
MOUNT C C
IMGMOUNT D ../../rom/JA1.gog -t iso
C:
JA.EXE ALLOWSAVE
